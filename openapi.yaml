
openapi: 3.0.3

info:
  title: Maji-Track API
  description: |
    API documentation for Maji-Track, a water shortage reporting
    and monitoring platform. Residents can submit reports, view
    approved reports and access dashboard information. Administrators
    can review and manage submitted reports.
  version: 1.0.0

servers:
  servers:
  - url: http://localhost:5555
    description: Local development server

  - url: https://YOUR-RAILWAY-DOMAIN.up.railway.app
    description: Production server (Railway)

tags:
  - name: Authentication
  - name: Administration
  - name: Submissions
  - name: Reports
  - name: Districts
  - name: Dashboard

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your access token.

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: wateruser
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: SecurePass123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    District:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Westlands

    Report:
      type: object
      properties:
        id:
          type: integer
        location:
          type: string
        district:
          type: string
        severity:
          type: string
          enum: [Critical, High, Moderate, Low]
        time_without_water:
          type: string
        description:
          type: string
        image_url:
          type: string
          nullable: true
        status:
          type: string
          example: Pending
        reporter:
          type: string
        created_at:
          type: string
          format: date-time

    SubmissionRequest:
      type: object
      required:
        - district_id
        - location
        - severity
        - time_without_water
        - description
      properties:
        district_id:
          type: integer
          minimum: 1
        location:
          type: string
          maxLength: 150
        severity:
          type: string
          enum: [Critical, High, Moderate, Low]
        time_without_water:
          type: string
          maxLength: 100
        description:
          type: string
        image:
          type: string
          format: binary

    Error:
      type: object
      properties:
        message:
          type: string

paths:
  /:
    get:
      summary: Check backend status
      responses:
        "200":
          description: Backend is running

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration started; verification required
        "400":
          description: Missing fields or invalid password
        "409":
          description: User already exists

  /api/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify user email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Email verified or already verified
        "400":
          description: Missing, invalid or expired verification code
        "404":
          description: User not found

  /api/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Verification code sent or account already verified
        "404":
          description: User not found

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful; returns access and refresh tokens
        "400":
          description: Missing credentials
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Generate a new access token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: New access token generated
        "401":
          description: Missing or invalid refresh token

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User information returned
        "401":
          description: Authentication required
        "404":
          description: User not found

  /api/admin/reports/pending:
    get:
      tags: [Administration]
      summary: Get pending reports
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending reports returned
        "403":
          description: Admin access required

  /api/admin/reports/approved:
    get:
      tags: [Administration]
      summary: Get approved reports
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Approved reports returned
        "403":
          description: Admin access required

  /api/admin/reports/{report_id}/approve:
    patch:
      tags: [Administration]
      summary: Approve a report
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report approved
        "400":
          description: Report is not pending
        "403":
          description: Admin access required
        "404":
          description: Report not found

  /api/admin/reports/{report_id}/reject:
    patch:
      tags: [Administration]
      summary: Reject a report
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report rejected
        "400":
          description: Report is not pending
        "403":
          description: Admin access required
        "404":
          description: Report not found

  /api/submissions:
    post:
      tags: [Submissions]
      summary: Submit a water shortage report
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "201":
          description: Report submitted successfully
        "400":
          description: Invalid or missing submission fields
        "401":
          description: Authentication required
        "404":
          description: District not found

  /api/submissions/{report_id}:
    patch:
      tags: [Submissions]
      summary: Update a submitted report
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                district_id:
                  type: integer
                location:
                  type: string
                severity:
                  type: string
                  enum: [Critical, High, Moderate, Low]
                time_without_water:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Report updated
        "400":
          description: Invalid update data
        "403":
          description: User is not authorized to update this report
        "404":
          description: Report or district not found

    delete:
      tags: [Submissions]
      summary: Delete a submitted report
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report deleted
        "403":
          description: User is not authorized to delete this report
        "404":
          description: Report not found

  /api/reports:
    get:
      tags: [Reports]
      summary: Get approved reports
      parameters:
        - name: district_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter reports by district ID
      responses:
        "200":
          description: Approved reports returned

  /api/reports/{report_id}:
    get:
      tags: [Reports]
      summary: Get a report by ID
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: integer
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: Report returned
        "404":
          description: Report not found or access denied

  /api/districts:
    get:
      tags: [Districts]
      summary: Get all districts
      responses:
        "200":
          description: Districts returned

  /api/districts/{district_id}:
    get:
      tags: [Districts]
      summary: Get a district by ID
      parameters:
        - name: district_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: District returned
        "404":
          description: District not found

  /api/districts/{district_id}/reports:
    get:
      tags: [Districts]
      summary: Get approved reports for a district
      parameters:
        - name: district_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: District reports returned
        "404":
          description: District not found

  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard summary returned
        "401":
          description: Authentication required

  /api/dashboard/recent-reports:
    get:
      tags: [Dashboard]
      summary: Get the ten most recent reports
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recent reports returned

  /api/dashboard/affected-areas:
    get:
      tags: [Dashboard]
      summary: Get affected areas and report counts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Affected areas returned

  /api/dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Get report trends for the last seven days
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Report trends returned

  /api/dashboard/top-affected-areas:
    get:
      tags: [Dashboard]
      summary: Get the five most affected areas
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Top affected areas returned
